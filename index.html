
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vite App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
    }

    #canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    #loadingScreen {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background: #000;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #loadingScreen img {
      max-width: 100%;
      height: auto;
      object-fit: contain;
      padding: 20px;
    }

    /* Media Queries for different screen sizes */
    @media (max-width: 768px) {
      #loadingScreen img {
        width: 90%;
      }
    }

    @media (orientation: portrait) {
      #loadingScreen img {
        width: 80%;
      }
    }

    .hidden {
      display: none !important;
    }

    /* Prevent text selection */
    body {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* For touch devices */
    @media (hover: none) and (pointer: coarse) {
      body {
        touch-action: none;
      }
    }

  </style>
  <script type="module" crossorigin src="/assets/index-Bpa2ktYX.js"></script>
</head>
<body>
<div id="loadingScreen">
  <img src="images/loading.png" alt="Loading...">
</div>
<canvas id="canvas"></canvas>
</body>
</html>
